 body {

}

.area-restrita {
  max-width: 480px;

}

.selo-invocacao {

  margin: 1.2rem 0;
  animation: pulsar 2s infinite;
  transition: transform 0.3s ease;
}

.selo-invocacao:hover {
  transform: scale(1.2);
}

@keyframes pulsar {
  0%, 100% { opacity: 0.6; transform: scale(1); }

}

.senha-revelada {

}

  border-radius: 8px;
  border: none;
  width: 70%;
  margin-bottom: 0.8rem;
  font-size: 1rem;
}

.login-secreto button {
  padding: 0.5rem 1rem;
  background-color: #ec407a;

  border-radius: 40px;

  function mostrarSenha() {
    document.getElementById("senha-revelada").style.display = "block";
  }

  function verificarSenha() {
    const senha = document.getElementById("senha").value;
    if (senha === "chakra") {
      window.location.href = "aventuras.html";
    } else {
      document.getElementById("erro").textContent = "Selo incorreto. Tente novamente.";
