<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <meta name="description" content="Entre no Portal Shinobi e descubra histórias, missões e segredos da Vila da Folha." />
  <title>Portal Shinobi — Abertura</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d9b66f;
      --mist: #d8dce5;
      --red: #e45b52;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      color: var(--mist);
      background:
        linear-gradient(110deg, rgba(5, 7, 12, .92), rgba(8, 9, 14, .56) 55%, rgba(5, 7, 12, .88)),
        url("imagens/casa.jpg") center / cover no-repeat,
        #08090d;
      font-family: "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background: radial-gradient(ellipse at center, transparent 10%, rgba(0, 0, 0, .62) 100%);
    }

    body::after {
      inset: 1rem;
      border: 1px solid rgba(217, 182, 111, .28);
      box-shadow: inset 0 0 70px rgba(0, 0, 0, .28);
    }

    .abertura {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      text-align: center;
      animation: revelar 1.2s ease both;
    }

    .simbolo {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 2rem;
      border: 1px solid rgba(217, 182, 111, .65);
      border-radius: 50%;
      color: var(--gold);
      font-size: 2rem;
      box-shadow: 0 0 35px rgba(217, 182, 111, .18), inset 0 0 20px rgba(217, 182, 111, .1);
      animation: pulsar 3.5s ease-in-out infinite;
    }

    .sobrelinha {
      margin: 0 0 1rem;
      color: var(--gold);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 9vw, 6.4rem);
      font-weight: 500;
      letter-spacing: .08em;
      line-height: 1.05;
      text-shadow: 0 0 34px rgba(228, 91, 82, .25);
    }

    .divisor {
      width: min(180px, 50%);
      height: 1px;
      margin: 1.8rem auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .descricao {
      max-width: 540px;
      margin: 0 auto;
      color: rgba(216, 220, 229, .82);
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      line-height: 1.8;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .botao {
      min-width: 190px;
      padding: .9rem 1.4rem;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: #100f0d;
      background: var(--gold);
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    }

    .botao:hover,
    .botao:focus-visible {
      transform: translateY(-3px);
      background: #efd18f;
      box-shadow: 0 0 24px rgba(217, 182, 111, .25);
    }

    .botao-secundario {
      color: var(--mist);
      background: rgba(8, 9, 14, .35);
      border-color: rgba(216, 220, 229, .38);
    }

    .botao-secundario:hover,
    .botao-secundario:focus-visible {
      color: #fff;
      background: rgba(8, 9, 14, .75);
    }

    .rodape {
      margin-top: 3rem;
      color: rgba(216, 220, 229, .55);
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    @keyframes revelar {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulsar {
      0%, 100% { box-shadow: 0 0 25px rgba(217, 182, 111, .12), inset 0 0 14px rgba(217, 182, 111, .08); }
      50% { box-shadow: 0 0 42px rgba(217, 182, 111, .28), inset 0 0 22px rgba(217, 182, 111, .16); }
    }

    @media (max-width: 520px) {
      body {
        padding: 1.5rem;
        background-position: 58% center;
      }

      body::after {
        inset: .6rem;
      }

      .acoes {
        flex-direction: column;
        align-items: center;
      }

      .botao {
        width: min(100%, 280px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <link rel="stylesheet" href="kunai-cursor.css" />
  <script src="kunai-cursor.js" defer></script>
</head>
<body>
  <main class="abertura">
    <div class="simbolo" aria-hidden="true">忍</div>
    <p class="sobrelinha">Crônicas da Vila da Folha</p>
    <h1>Portal<br />Shinobi</h1>
    <div class="divisor" aria-hidden="true"></div>
    <p class="descricao">
      Entre em um universo de missões, lendas e histórias que atravessam gerações.
      O próximo capítulo começa quando você cruza os portões.
    </p>
    <nav class="acoes" aria-label="Navegação da abertura">
      <a class="botao" href="portal.html">Entrar no portal</a>
      <a class="botao botao-secundario" href="kurosaki.html">Conhecer os shinobi</a>
    </nav>
    <p class="rodape">Chakra · coragem · legado</p>
  </main>
</body>
</html>
