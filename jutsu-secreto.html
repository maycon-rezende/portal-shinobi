<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Área Restrita - Jutsu Secreto</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', sans-serif;
      text-align: center;
      color: #fff;
      background: url('img/kuromei.png') no-repeat center top;
      background-size: cover; /* cobre toda a tela */
      background-attachment: scroll; /* rola junto */
      min-height: 200vh; /* força scroll */
      overflow-y: scroll;
    }
    .overlay {

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    h2 {
      color: #ff4500;
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px #000;
      animation: glow 2s infinite alternate;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 30px;
      text-shadow: 1px 1px 5px #000;
      animation: fadeInText 3s ease-in-out;
    }
    input {
      padding: 10px;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
      font-size: 1em;
    }
    button {
      background-color: #b22222;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
      animation: pulse 2s infinite;
    }
    button:hover {
      background-color: #ff4500;
    }

    /* Animações */
    @keyframes glow {
      from {text-shadow: 0 0 5px #ff4500;}
      to {text-shadow: 0 0 20px #ff6347;}
    }
    @keyframes pulse {
      0% {transform: scale(1);}
      50% {transform: scale(1.1);}
      100% {transform: scale(1);}
    }
    @keyframes fadeInText {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* Canvas das partículas */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Espaço extra para scroll */
    .spacer {
      height: 100vh;
    }
  </style>
  <link rel="stylesheet" href="kunai-cursor.css" />
  <script src="kunai-cursor.js" defer></script>
</head>
<body>
  <!-- Canvas para partículas -->
  <canvas id="particles"></canvas>

 <div class="overlay">
  <h2>Um Novo Mundo</h2>
  <p>Você está pronto para ver o que tem do outro lado?</p>

  <button onclick="window.location.href='index2.html'">Entrar no Portal</button>

</div>


  <!-- Espaço extra para permitir scroll -->
  <div class="spacer"></div>

  <!-- Música de fundo -->
  <audio autoplay loop>
    <source src="musicas/01.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio.
  </audio>

  <script>
    // Partículas ninjas
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 3 + 1,
        dx: (Math.random() - 0.5) * 1,
        dy: (Math.random() - 0.5) * 1,
        color: "rgba(255, 69, 0, 0.8)"
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
