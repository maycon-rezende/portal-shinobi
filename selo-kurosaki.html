<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Selo Kurosaki</title>
  <link rel="stylesheet" href="style.css">
  <style>
  body {
  margin: 0;
  padding: 0;
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #0d0d0d, #000000);
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.05;
  animation: flutuar 40s linear infinite;
  z-index: 0;
}

@keyframes flutuar {
  from { background-position: 0 0; }
  to { background-position: 1000px 1000px; }
}

#selo-kurosaki {
  position: relative;
  z-index: 1;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: url('imagens/MSE.png') no-repeat center center;
  background-size: cover;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
  transition: transform 0.2s ease, box-shadow 0.4s ease;
}

#selo-kurosaki.active {
  transform: scale(1.6); /* Cresce mais! */
  box-shadow: 0 0 60px rgba(255, 0, 0, 0.8);
  animation: pulsar 0.6s ease;
}

@keyframes pulsar {
  0% { transform: scale(1.6); }
  50% { transform: scale(1.8); }
  100% { transform: scale(1.6); }
}


  </style>
  <link rel="stylesheet" href="kunai-cursor.css" />
  <script src="kunai-cursor.js" defer></script>
</head>
<body>
  <div id="selo-kurosaki"></div>
  <audio id="audio-ativacao" src="audio/12.mp3" preload="auto"></audio>
  <script>
    const selo = document.getElementById('selo-kurosaki');
const audio = document.getElementById('audio-ativacao');

selo.addEventListener('click', () => {
  selo.classList.add('active');
  audio.play();

  setTimeout(() => {
    window.location.href = 'galeria-kurosaki.html';
  }, 1200);
});

  </script>
</body>
</html>
